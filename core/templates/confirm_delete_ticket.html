{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 500px; margin-top: 50px; text-align: center;">
    <div class="card" style="background: var(--card-bg); padding: 30px; border-radius: 15px;">
        <h2 style="color: #dc3545;">آیا مطمئن هستید؟</h2>
        <p>آیا می‌خواهید تیکت "{{ ticket.subject }}" را حذف کنید؟ این عملیات غیرقابل بازگشت است.</p>
        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            <button type="submit" style="padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 10px;">بله، حذف کن</button>
            <a href="{% url 'admin_ticket_list' %}" style="padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 8px; display: inline-block;">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
